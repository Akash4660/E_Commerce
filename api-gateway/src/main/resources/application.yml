server:
    port: 8080
spring:
  application:
    name: api-gateway   
spring.cloud:
  gateway:
    routes:
      - id: auth-service
        uri: http://localhost:8081
        predicates:
          - Path=/api/auth/**
      - id: show-service
        uri: http://localhost:8083
        predicates:
          - Path=/api/shows/**
      - id: booking-service
        uri: http://localhost:8082
        predicates:
          - Path=/api/bookings/**
